name: build and push image

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The Rust build needs room; runners ship with a lot of preinstalled
      # tooling we don't use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: erenyegit
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Akash providers run linux/amd64, which is also the runner's native
      # architecture, so no emulation is involved.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: erenyegit/buzz-goose-agent:1.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
